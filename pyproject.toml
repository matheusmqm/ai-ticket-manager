[project]
name = "ai-ticket-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.8.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "playwright>=1.65.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pywinauto>=0.6.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
